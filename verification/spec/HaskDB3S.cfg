\* Run A3S: core properties with three transactions over a reduced key
\* space (k1 present, k2 absent), so the 3-transaction check stays
\* exhaustive on this machine. All phenomena remain exercisable:
\* point reads/writes/deletes on k1, insert + phantom via k2.
SPECIFICATION Spec
CONSTANT
  Txns = {t1, t2, t3}
  Keys = {k1, k2}
  Vals = {v0, v1}
  AbsentKey = k2
  InitVal = v0
  NoVal = nv
  None = none
  NoTxn = notxn
SYMMETRY TxnPerms
INVARIANTS
  TypeOK
  LockSafety
  NoDirtyRead
  NoNonRepeatableRead
  NoLostUpdate
  AtomicCommit
