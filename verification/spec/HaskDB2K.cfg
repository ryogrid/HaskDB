\* Run A2K (fallback): core properties, 2 transactions over a reduced
\* key space (k1 present, k2 absent). Same invariants as HaskDB.cfg.
SPECIFICATION Spec
CONSTANT
  Txns = {t1, t2}
  Keys = {k1, k2}
  Vals = {v0, v1}
  AbsentKey = k2
  InitVal = v0
  NoVal = nv
  None = none
  NoTxn = notxn
SYMMETRY TxnPerms
INVARIANTS
  TypeOK
  LockSafety
  NoDirtyRead
  NoNonRepeatableRead
  NoLostUpdate
  AtomicCommit
